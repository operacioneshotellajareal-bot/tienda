<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tienda de Ropa</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6a1b9a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tienda">
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f4f6fb;color:#1c2430}
:root{--acc:#6a1b9a;--acc2:#c2185b;--tint:#f3e6fa}
button{cursor:pointer;font-family:inherit}
input,select{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid #d5dbe6;border-radius:9px;width:100%;background:#fff}
label{display:block;font-size:12.5px;color:#55637a;margin:0 0 4px;font-weight:600}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.lcard{background:#fff;border-radius:18px;padding:30px 26px;max-width:340px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:center}
.lcard h1{font-size:22px;margin:4px 0 2px;color:var(--acc)}
.lcard p{color:#8893a5;font-size:13px;margin:0 0 18px}
.lcard .field{text-align:left;margin-bottom:12px}
.btn-main{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:12px;font-size:16px;font-weight:700;width:100%}
/* app */
.topbar{background:var(--acc);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.topbar .nom{font-weight:800;font-size:17px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .tasa{font-size:12.5px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px;white-space:nowrap}
.tabs{display:flex;gap:4px;background:#fff;padding:6px;overflow-x:auto;border-bottom:1px solid #e4e9f2;position:sticky;top:46px;z-index:19}
.tab{flex:none;padding:9px 14px;border-radius:9px;font-size:14px;font-weight:600;color:#55637a;background:transparent;border:none;white-space:nowrap}
.tab.on{background:var(--tint);color:var(--acc)}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 90px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:16px 18px;margin-bottom:14px}
.card h2{font-size:17px;color:var(--acc);margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:120px}
.btn{border:none;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:700;color:#fff;background:var(--acc)}
.btn.g{background:#2e7d32}.btn.r{background:#c62828}.btn.gh{background:#eef1f7;color:#44506a}.btn.o{background:#ef6c00}
.btn.sm{padding:6px 10px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid #eef1f6}
th{color:#55637a;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
td.r,th.r{text-align:right}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:700}
.tag.low{background:#fdecea;color:#c62828}.tag.ok{background:#e8f5e9;color:#2e7d32}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:140px;background:#fff;border-radius:12px;padding:14px 16px;border-left:5px solid var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.stat .n{font-size:21px;font-weight:800}
.stat .l{font-size:12px;color:#8893a5}
.empty{text-align:center;color:#8893a5;padding:30px 10px;font-size:14px}
.modal-bg{position:fixed;inset:0;background:rgba(20,24,33,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal{background:#fff;border-radius:18px 18px 0 0;padding:20px 18px 26px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.modal h3{margin:0 0 14px;color:var(--acc);font-size:18px}
.modal .field{margin-bottom:11px}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.fab{position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;border:none;font-size:30px;box-shadow:0 6px 20px rgba(106,27,154,.45);z-index:15}
.lineitem{background:#f7f9fc;border:1px solid #e4e9f2;border-radius:10px;padding:10px;margin-bottom:8px}
.muted{color:#8893a5;font-size:12.5px}
.pill{font-size:11.5px;background:var(--tint);color:var(--acc);padding:2px 8px;border-radius:20px;font-weight:700}
@media(min-width:620px){.modal{border-radius:18px;align-self:center}.modal-bg{align-items:center}}
</style></head><body>

<div id="login">
  <div class="lcard">
    <div id="lg-logo" style="font-size:40px">👗</div>
    <h1 id="lg-nom">Mi Tienda</h1>
    <p>Entra para administrar tu tienda</p>
    <div class="field"><label>Contraseña</label><input id="lg-pass" type="password" placeholder="****" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn-main" onclick="doLogin()">Entrar</button>
    <p style="margin-top:14px;font-size:11.5px" id="lg-hint"></p>
  </div>
</div>

<div id="app" class="hide">
  <div class="topbar">
    <img id="tb-logo" class="hide" style="height:30px;width:30px;border-radius:7px;object-fit:cover;background:#fff">
    <div class="nom" id="tb-nom">Mi Tienda</div>
    <div class="tasa" id="tb-tasa"></div>
    <button class="btn gh sm" onclick="logout()" style="color:#fff;background:rgba(255,255,255,.18)">Salir</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="banner" class="hide"></div>
  <div class="wrap" id="view"></div>
</div>

<div id="modalHost"></div>

<script>
/* ===== Datos ===== */
const LS='tienda_ropa_v1';
function defDB(){return {store:{nombre:'Mi Tienda',tasa:40,pass:'1234',margen:100,color:'#6a1b9a',color2:'#c2185b',logoSize:64,proxNro:1},productos:[],compras:[],ventas:[],gastos:[]};}
let DB=defDB();
try{const d=JSON.parse(localStorage.getItem(LS)); if(d&&typeof d==='object'){DB=Object.assign(defDB(),d); DB.store=Object.assign(defDB().store,d.store||{});}}catch(e){}
function save(){ try{localStorage.setItem(LS,JSON.stringify(DB));return true;}catch(e){ alert('⚠️ No se pudo guardar: el teléfono se quedó sin espacio. Suele pasar por muchas fotos pesadas. Quita alguna foto de producto e intenta de nuevo.'); return false; } }
let SES=false, TAB='vender';

/* ===== Dinero ===== */
function num(x){return Number(x)||0;}
function usd(n){return '$'+num(n).toFixed(2);}
function bs(n){return 'Bs '+(num(n)*num(DB.store.tasa)).toLocaleString('es-VE',{maximumFractionDigits:2});}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hoy(){return new Date().toISOString().slice(0,10);}
function fFecha(iso){const d=new Date(iso); return isNaN(d)?iso:d.toLocaleDateString('es-VE');}
function ymd(iso){return String(iso||'').slice(0,10);}
function mesDe(iso){return String(iso||'').slice(0,7);}
function mid(){return 'id'+Date.now()+Math.floor(Math.random()*999);}

/* ===== Colores / tema ===== */
function hexToRgb(h){h=String(h||'').replace('#',''); if(h.length===3)h=h.split('').map(x=>x+x).join(''); const n=parseInt(h,16)||0; return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
function themeVars(){const c=DB.store.color||'#6a1b9a',c2=DB.store.color2||'#c2185b',rg=hexToRgb(c); return ':root{--acc:'+c+';--acc2:'+c2+';--tint:rgba('+rg.r+','+rg.g+','+rg.b+',0.13)}';}
function applyTheme(){const c=DB.store.color||'#6a1b9a',c2=DB.store.color2||'#c2185b',rg=hexToRgb(c); const rs=document.documentElement.style; rs.setProperty('--acc',c); rs.setProperty('--acc2',c2); rs.setProperty('--tint','rgba('+rg.r+','+rg.g+','+rg.b+',0.13)');}
const PALETA=[['Morado','#6a1b9a','#c2185b'],['Azul','#1565c0','#0d47a1'],['Verde','#2e7d32','#1b5e20'],['Rojo','#c62828','#ad1457'],['Naranja','#ef6c00','#e65100'],['Rosado','#d81b60','#8e24aa'],['Turquesa','#00897b','#00695c'],['Gris','#37474f','#263238']];
function setColor(c,c2){DB.store.color=c; DB.store.color2=c2||c; save(); applyTheme(); render(); pintarLogin();}

/* ===== Login ===== */
function pintarLogin(){document.getElementById('lg-nom').innerText=DB.store.nombre||'Mi Tienda'; const ll=document.getElementById('lg-logo'); if(ll)ll.innerHTML=DB.store.logo?'<img src="'+DB.store.logo+'" style="height:'+(num(DB.store.logoSize)||64)+'px;max-width:240px;border-radius:12px">':'👗'; document.getElementById('lg-hint').innerText=(DB.store.pass==='1234')?'Clave de prueba: 1234 (cámbiala en Configuración)':'';}
function doLogin(){const p=document.getElementById('lg-pass').value; if(p===String(DB.store.pass)){SES=true; document.getElementById('login').classList.add('hide'); document.getElementById('app').classList.remove('hide'); render();} else {alert('Contraseña incorrecta');}}
function logout(){SES=false; document.getElementById('lg-pass').value=''; document.getElementById('app').classList.add('hide'); document.getElementById('login').classList.remove('hide'); pintarLogin();}

/* ===== Marco ===== */
const TABS=[['vender','🛍️ Vender'],['inventario','📦 Inventario'],['compras','📥 Compras'],['fiados','💳 Fiados'],['gastos','💸 Gastos'],['reportes','📊 Reportes'],['config','⚙️ Config']];
function render(){
  applyTheme();
  document.getElementById('tb-nom').innerText=DB.store.nombre||'Mi Tienda';
  const tl=document.getElementById('tb-logo'); if(tl){if(DB.store.logo){tl.src=DB.store.logo; tl.style.height=Math.min(44,(num(DB.store.logoSize)||64))+'px'; tl.style.width='auto'; tl.style.objectFit='contain'; tl.classList.remove('hide');}else{tl.classList.add('hide');}}
  document.getElementById('tb-tasa').innerText='Tasa: '+num(DB.store.tasa)+' Bs/$';
  document.getElementById('tabs').innerHTML=TABS.map(t=>'<button class="tab '+(TAB===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>').join('');
  const v=document.getElementById('view');
  if(TAB==='vender') v.innerHTML=viewVender();
  else if(TAB==='inventario') v.innerHTML=viewInventario();
  else if(TAB==='compras') v.innerHTML=viewCompras();
  else if(TAB==='fiados') v.innerHTML=viewFiados();
  else if(TAB==='gastos') v.innerHTML=viewGastos();
  else if(TAB==='reportes') v.innerHTML=viewReportes();
  else if(TAB==='config') v.innerHTML=viewConfig();
  pintarBanner();
}
function setTab(t){TAB=t; if(t!=='vender') CART=[]; render();}

/* ===== Modal ===== */
function modal(html){document.getElementById('modalHost').innerHTML='<div class="modal-bg" onclick="if(event.target===this)cerrar()"><div class="modal">'+html+'</div></div>';}
function cerrar(){document.getElementById('modalHost').innerHTML='';}
let fotoEdit='';
function cargarFoto(input){ const f=input.files&&input.files[0]; if(!f)return; const r=new FileReader(); r.onload=function(e){ const img=new Image(); img.onload=function(){ const MAX=420; let w=img.width,hh=img.height; if(w>=hh){ if(w>MAX){hh=Math.round(hh*MAX/w); w=MAX;} } else { if(hh>MAX){w=Math.round(w*MAX/hh); hh=MAX;} } const cv=document.createElement('canvas'); cv.width=w; cv.height=hh; cv.getContext('2d').drawImage(img,0,0,w,hh); fotoEdit=cv.toDataURL('image/jpeg',0.7); const pv=document.getElementById('p-fotoprev'); if(pv)pv.innerHTML='<img src="'+fotoEdit+'" style="width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid #e4e9f2">'; const bq=document.getElementById('p-fotoquit'); if(bq)bq.style.display='inline-block'; }; img.src=e.target.result; }; r.readAsDataURL(f); }
function quitarFoto(){ fotoEdit=''; const pv=document.getElementById('p-fotoprev'); if(pv)pv.innerHTML='<div class="muted" style="font-size:13px">Sin foto</div>'; const bq=document.getElementById('p-fotoquit'); if(bq)bq.style.display='none'; }
function vistaRapida(id){ const p=prodById(id); if(!p)return; let h='<h3>'+esc(p.nombre)+'</h3>'; if(p.foto){h+='<img src="'+p.foto+'" style="width:100%;max-height:62vh;object-fit:contain;border-radius:12px;background:#f2f4f8">';} else {h+='<div class="empty">Este producto no tiene foto.</div>';} if(p.talla||p.color)h+='<p class="muted" style="margin:8px 0 0">'+esc(((p.talla||'')+' '+(p.color||'')).trim())+'</p>'; if(p.descripcion)h+='<p style="margin:4px 0">'+esc(p.descripcion)+'</p>'; h+='<p style="font-size:18px;font-weight:800;color:var(--acc);margin:8px 0 0">'+usd(p.precioVenta)+' <span class="muted" style="font-size:13px;font-weight:500">stock '+num(p.stock)+'</span></p>'; h+='<div class="actions">'+(num(p.stock)>0?'<button class="btn g" onclick="addCart(\''+id+'\');cerrar()">🛒 Agregar al carrito</button>':'')+'<button class="btn gh" onclick="cerrar()">Cerrar</button></div>'; modal(h); }

/* ===== Inventario ===== */
function umbral(){return num(DB.store.umbral)||3;}
let qInv='';
function prodById(id){return DB.productos.find(p=>p.id===id);}
function gananciaU(p){return num(p.precioVenta)-num(p.costoNeto);}
function viewInventario(){
  const ps=DB.productos;
  let uds=0,vCosto=0,vVenta=0;
  ps.forEach(p=>{uds+=num(p.stock); vCosto+=num(p.stock)*num(p.costoNeto); vVenta+=num(p.stock)*num(p.precioVenta);});
  let h='<div class="stats">';
  h+='<div class="stat"><div class="n">'+ps.length+'</div><div class="l">Productos</div></div>';
  h+='<div class="stat" style="border-left-color:#1565c0"><div class="n">'+uds+'</div><div class="l">Unidades en stock</div></div>';
  h+='<div class="stat" style="border-left-color:#ef6c00"><div class="n" style="font-size:17px">'+usd(vCosto)+'</div><div class="l">Invertido (costo)</div></div>';
  h+='<div class="stat" style="border-left-color:#2e7d32"><div class="n" style="font-size:17px">'+usd(vVenta)+'</div><div class="l">Valor a precio venta</div></div></div>';
  h+='<div class="card"><h2>📦 Inventario</h2>';
  h+='<div class="row" style="margin-bottom:10px"><div style="flex:2"><input placeholder="Buscar producto, talla o color" value="'+esc(qInv)+'" oninput="qInv=this.value;render()"></div><div style="flex:0"><button class="btn g" onclick="editarProd()">+ Producto</button></div></div>';
  let list=ps.slice().sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
  if(qInv.trim()){const q=qInv.toLowerCase(); list=list.filter(p=>(p.nombre+' '+p.talla+' '+p.color).toLowerCase().includes(q));}
  if(!list.length){h+='<div class="empty">No hay productos. Toca <b>+ Producto</b> o regístralos desde <b>Compras</b>.</div>';}
  else{
    h+='<div class="muted" style="font-size:12px;margin-bottom:8px">'+list.length+' producto'+(list.length===1?'':'s')+' · toca uno para editarlo</div>';
    h+='<div style="display:flex;flex-direction:column;gap:6px">';
    list.forEach(p=>{const bajo=num(p.stock)<=umbral(); const g=gananciaU(p);
      h+='<div onclick="editarProd(\''+p.id+'\')" style="display:flex;gap:10px;align-items:center;padding:7px 10px;border:1px solid #e4e9f2;border-radius:10px;cursor:pointer;background:#fff">';
      h+=(p.foto?'<img src="'+p.foto+'" style="width:38px;height:38px;object-fit:cover;border-radius:8px;flex:0 0 auto">':'<div style="width:38px;height:38px;border-radius:8px;flex:0 0 auto;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--acc);font-weight:700">'+esc((p.nombre||'?').slice(0,1).toUpperCase())+'</div>');
      h+='<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(p.nombre)+((p.talla||p.color)?' <span class="muted" style="font-weight:400">'+esc(((p.talla||'')+' '+(p.color||'')).trim())+'</span>':'')+'</div><div class="muted" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Venta '+usd(p.precioVenta)+' · Costo '+usd(p.costoNeto)+' · Gan <span style="color:'+(g>=0?'#2e7d32':'#c62828')+';font-weight:600">'+usd(g)+'</span></div></div>';
      h+='<span class="tag '+(bajo?'low':'ok')+'" style="flex:0 0 auto">'+num(p.stock)+'</span>';
      h+='</div>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}
function editarProd(id){
  const p=id?prodById(id):{id:'',nombre:'',descripcion:'',talla:'',color:'',stock:0,costoNeto:0,precioVenta:0,foto:''};
  fotoEdit=p.foto||'';
  let h='<h3>'+(id?'Editar producto':'Nuevo producto')+'</h3>';
  h+='<div class="field"><label>Nombre</label><input id="p-nom" value="'+esc(p.nombre)+'"></div>';
  h+='<div class="field"><label>Descripción (opcional)</label><input id="p-desc" value="'+esc(p.descripcion||'')+'" placeholder="ej: Blusa manga larga, algodón"></div>';
  h+='<div class="row"><div class="field"><label>Talla</label><input id="p-talla" value="'+esc(p.talla)+'" placeholder="S, M, L, 38..."></div><div class="field"><label>Color</label><input id="p-color" value="'+esc(p.color)+'"></div></div>';
  h+='<div class="row"><div class="field"><label>Stock (unidades)</label><input id="p-stock" type="number" value="'+num(p.stock)+'"></div><div class="field"><label>Costo real (c/u $)</label><input id="p-costo" type="number" step="0.01" value="'+num(p.costoNeto)+'"></div></div>';
  h+='<div class="field"><label>Precio de venta (c/u $)</label><input id="p-venta" type="number" step="0.01" value="'+num(p.precioVenta)+'"></div>';
  h+='<div class="field"><label>Foto (opcional)</label><div id="p-fotoprev">'+(p.foto?'<img src="'+p.foto+'" style="width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid #e4e9f2">':'<div class="muted" style="font-size:13px">Sin foto</div>')+'</div><input type="file" accept="image/*" onchange="cargarFoto(this)" style="margin-top:6px"> <button type="button" class="btn gh sm" id="p-fotoquit" style="margin-top:6px;display:'+(p.foto?'inline-block':'none')+'" onclick="quitarFoto()">Quitar foto</button><div class="muted" style="font-size:12px">La foto se achica sola para no poner lenta la app.</div></div>';
  h+='<div class="muted">La ganancia se calcula sola: precio de venta menos costo real.</div>';
  h+='<div class="actions"><button class="btn g" onclick="guardarProd(\''+(id||'')+'\')">Guardar</button>'+(id?'<button class="btn r" onclick="borrarProd(\''+id+'\')">Eliminar</button>':'')+'<button class="btn gh" onclick="cerrar()">Cancelar</button></div>';
  modal(h);
}
function guardarProd(id){
  const nom=document.getElementById('p-nom').value.trim(); if(!nom){alert('Escribe el nombre');return;}
  const o={nombre:nom,descripcion:document.getElementById('p-desc').value.trim(),talla:document.getElementById('p-talla').value.trim(),color:document.getElementById('p-color').value.trim(),stock:num(document.getElementById('p-stock').value),costoNeto:num(document.getElementById('p-costo').value),precioVenta:num(document.getElementById('p-venta').value),foto:fotoEdit||''};
  if(id){Object.assign(prodById(id),o);} else {o.id=mid(); DB.productos.push(o);}
  save(); cerrar(); render();
}
function borrarProd(id){if(!confirm('¿Eliminar este producto del inventario?'))return; DB.productos=DB.productos.filter(p=>p.id!==id); save(); cerrar(); render();}

/* ===== Compras (mercancía desde China) ===== */
function viewCompras(){
  const cs=DB.compras.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  let invTot=0,fleteTot=0; cs.forEach(c=>{invTot+=num(c.costoTotal); fleteTot+=num(c.fleteTotal);});
  let h='<div class="stats">';
  h+='<div class="stat" style="border-left-color:#ef6c00"><div class="n" style="font-size:17px">'+usd(invTot)+'</div><div class="l">Total comprado (con flete)</div></div>';
  h+='<div class="stat" style="border-left-color:#1565c0"><div class="n" style="font-size:17px">'+usd(fleteTot)+'</div><div class="l">Total en flete</div></div>';
  h+='<div class="stat"><div class="n">'+cs.length+'</div><div class="l">Pedidos registrados</div></div></div>';
  h+='<div class="card"><h2>📥 Compras de mercancía</h2>';
  h+='<p class="muted" style="margin-top:-6px">Registra cada pedido (ej. desde China): el costo de cada prenda y el flete. El sistema reparte el flete y calcula el <b>costo real</b> de cada producto y lo suma al inventario.</p>';
  h+='<button class="btn g" onclick="nuevaCompra()">+ Registrar pedido</button>';
  if(!cs.length){h+='<div class="empty">Aún no has registrado pedidos.</div>';}
  else{

let COMPRA=null;

function fiar(){

  let totV=0,totG=0,totC=0; CART.forEach(c=>{totV+=c.cantidad*num(c.precio); totC+=c.cantidad*num(c.costoNeto); totG+=c.cantidad*(num(c.precio)-num(c.costoNeto));});

  DB.store.proxNro=nro+1;

function abonarFiado(id){
  const v=DB.ventas.find(x=>x.id===id); if(!v)return;

  let m=num(prompt('Saldo de '+(v.cliente||'cliente')+': '+usd(saldo)+'\n¿Cuánto abona ahora? ($)',String(saldo.toFixed(2))));
  if(!(m>0))return;
  if(m>saldo)m=saldo;
  v.pagos=v.pagos||[]; v.pagos.push({fecha:new Date().toISOString(),monto:m});
  v.abonado=num(v.abonado)+m;
  save(); render();
  const nuevo=num(v.totalUsd)-num(v.abonado);
  alert(nuevo<=0.009?('✅ Cuenta saldada. '+(v.cliente||'El cliente')+' ya no debe nada.'):('✅ Abono registrado. Nuevo saldo de '+(v.cliente||'cliente')+': '+usd(nuevo)));

function diasRest(v){ if(!v.vence)return null; const h0=new Date(); h0.setHours(0,0,0,0); const d=new Date(v.vence+'T00:00:00'); if(isNaN(d))return null; return Math.round((d-h0)/86400000); }

  imprimirHTML('Recibo N° '+v.nro, c);
}
function bajarArchivo(nombre,texto,tipo){const b=new Blob([texto],{type:tipo||'text/plain;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nombre; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
function csvCell(s){s=String(s==null?'':s); return '"'+s.replace(/"/g,'""')+'"';}
function exportVentasCSV(){const vts=DB.ventas.filter(v=>mesDe(v.fecha)===repMes).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))); let rows=[['Fecha','Hora','Producto','Talla','Color','Cantidad','Precio USD','Costo USD','Ganancia USD']]; vts.forEach(v=>{const d=new Date(v.fecha); v.items.forEach(i=>{rows.push([fFecha(v.fecha), isNaN(d)?'':d.toLocaleTimeString('es-VE'), i.nombre, i.talla||'', i.color||'', num(i.cantidad), num(i.precio).toFixed(2), num(i.costoNeto).toFixed(2), (num(i.cantidad)*(num(i.precio)-num(i.costoNeto))).toFixed(2)]);});}); const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'); bajarArchivo('ventas-'+repMes+'.csv', csv, 'text/csv;charset=utf-8');}

  h+='<div class="muted">El recibo lleva un número de control que sube solo con cada venta.</div>';

async function traerBCV(){const m=document.getElementById('s-bcvmsg'); if(m)m.innerText='Consultando al BCV…'; try{const r=await fetch('https://ve.dolarapi.com/v1/dolares/oficial'); if(!r.ok)throw 0; const d=await r.json(); if(!d||!d.promedio)throw 0; DB.store.tasa=Number(Number(d.promedio).toFixed(2)); save(); render(); }catch(e){const m2=document.getElementById('s-bcvmsg'); if(m2)m2.innerText='No se pudo conectar con el BCV. Revisa tu internet o escribe la tasa a mano.';}}
function cargarLogo(inp){const f=inp.files&&inp.files[0]; if(!f){return;} if(!/^image\//.test(f.type)){alert('Elige una imagen (PNG o JPG)'); inp.value=''; return;} const rd=new FileReader(); rd.onload=()=>{const img=new Image(); img.onload=()=>{const max=256; let w=img.width,h=img.height; if(w>=h){if(w>max){h=Math.round(h*max/w); w=max;}}else{if(h>max){w=Math.round(w*max/h); h=max;}} const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); try{DB.store.logo=cv.toDataURL('image/png'); save();}catch(e){alert('No se pudo guardar el logo, prueba una imagen más pequeña');} render(); pintarLogin();}; img.onerror=()=>alert('No se pudo leer la imagen'); img.src=rd.result;}; rd.readAsDataURL(f); inp.value='';}
function quitarLogo(){if(!confirm('¿Quitar el logo?'))return; DB.store.logo=''; save(); render(); pintarLogin();}
function reiniciarApp(){ if(!confirm('Esto deja la app como recén instalada: borra inventario, compras, ventas, logo, nombre y colores, y la clave vuelve a 1234. ¿Seguro?'))return; if(!confirm('Última confirmación: NO se puede deshacer. ¿Dejar todo desde el inicio?'))return; localStorage.removeItem(LS); DB=defDB(); CART=[]; qInv=''; qVen=''; repNro=''; repMes=mesDe(new Date().toISOString()); TAB='vender'; save(); SES=false; applyTheme(); pintarLogin(); document.getElementById('app').classList.add('hide'); document.getElementById('login').classList.remove('hide'); alert('✅ Listo, la app quedó como nueva. Entra con la clave 1234.'); }
function guardarConfig(){DB.store.nombre=document.getElementById('s-nom').value.trim()||'Mi Tienda'; DB.store.tasa=num(document.getElementById('s-tasa').value); DB.store.umbral=Math.max(0,Math.round(num(document.getElementById('s-umbral').value))); DB.store.margen=num(document.getElementById('s-margen').value); const ls=document.getElementById('s-logosize'); if(ls)DB.store.logoSize=Math.max(30,Math.min(140,num(ls.value)||64)); const nr=document.getElementById('s-nro'); if(nr)DB.store.proxNro=Math.max(1,Math.round(num(nr.value)||1)); save(); render(); alert('Guardado');}
function guardarPass(){const p=document.getElementById('s-pass').value.trim(); if(!p){alert('Escribe la nueva contraseña o deja de cambiarla');return;} DB.store.pass=p; save(); alert('Contraseña cambiada'); render();}
function exportTodo(){bajarArchivo('respaldo-tienda-'+hoy()+'.json', JSON.stringify(DB), 'application/json');}
function importTodo(inp){const f=inp.files&&inp.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{try{const d=JSON.parse(rd.result); if(!d||typeof d!=='object')throw 0; if(!confirm('Esto reemplaza TODOS los datos actuales por los del respaldo. ¿Continuar?'))return; DB=Object.assign(defDB(),d); DB.store=Object.assign(defDB().store,d.store||{}); save(); render(); alert('Respaldo cargado');}catch(e){alert('El archivo no es un respaldo válido');} inp.value='';}; rd.readAsText(f);}
function exportInvCSV(){let rows=[['Producto','Talla','Color','Stock','Costo real USD','Precio venta USD','Ganancia USD']]; DB.productos.forEach(p=>rows.push([p.nombre,p.talla||'',p.color||'',num(p.stock),num(p.costoNeto).toFixed(2),num(p.precioVenta).toFixed(2),gananciaU(p).toFixed(2)])); const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'); bajarArchivo('inventario-'+hoy()+'.csv', csv, 'text/csv;charset=utf-8');}

applyTheme();
pintarLogin();
/* ===== PWA: instalación ===== */
let deferredPrompt=null;
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; const b=document.getElementById('btnInstalar'); if(b)b.style.display='inline-block'; });
window.addEventListener('appinstalled',()=>{ deferredPrompt=null; const b=document.getElementById('btnInstalar'); if(b)b.style.display='none'; });
function instalarApp(){ if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; }); } else { alert('Para instalar:\n\n📱 iPhone (Safari): toca el botón Compartir y luego “Agregar a inicio”.\n\n🤖 Android (Chrome): menú ⋮ y “Instalar aplicación”.\n\n💻 Windows (Chrome/Edge): icono de instalar en la barra de direcciones.'); } }
